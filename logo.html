<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>CyclonesTV</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; min-height: 100%; margin: 0; }
  body { min-height: 100vh; display: grid; place-items: center; background: #fff; position: relative; }
  img { display: block; width: min(100vw, 720px); height: auto; }
  a { position: fixed; top: 20px; left: 20px; padding: 10px 16px; border-radius: 8px; background: #063b70; color: #fff; font: 600 14px/1.3 "Segoe UI", system-ui, sans-serif; text-decoration: none; }
  a:hover { background: #07549e; }
  @media (max-width: 540px) { a { top: 12px; left: 12px; } }
</style>
</head>
<body>
<a href="/">&#8592; Retour au viewer</a>
<img src="logo.png" alt="Logo de CyclonesTV">
<script>
  fetch('config.json', { cache: 'no-store' })
    .then((response) => {
      if (!response.ok) throw new Error('HTTP ' + response.status);
      return response.json();
    })
    .then((config) => {
      if (typeof config.logoPageTitle === 'string' && config.logoPageTitle.trim()) {
        document.title = config.logoPageTitle;
      }
    })
    .catch((error) => console.error('Impossible de charger le titre de la page logo :', error));
</script>
</body>
</html>
